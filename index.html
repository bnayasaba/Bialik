<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תכנית ביאליק | נוכחות</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;background:#f7f8f6;color:#1e352e}*{box-sizing:border-box}body{margin:0}header{background:#214f3e;color:#fff;padding:28px 16px}header>div,main{max-width:780px;margin:auto}header h1{font-size:29px;margin:0 0 6px}header p{margin:0;color:#d7e8df}main{padding:22px 14px 60px}.panel,.session{background:#fff;border:1px solid #e1e8e2;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #162c1d09}label{display:block;font-weight:700;margin-bottom:7px}select{width:100%;padding:13px;border-radius:9px;border:1px solid #bdcec3;background:white;font-size:17px}h2{font-size:22px;margin:0 0 8px}h3{font-size:19px}p{line-height:1.6}.muted{color:#62776a}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.stats div{background:#eef5ef;border-radius:11px;padding:15px}.stats strong{display:block;font-size:25px;margin-top:4px}.stats small,.session small{color:#647669}.session-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{font-size:12px;background:#edf4ec;border-radius:30px;padding:5px 9px;color:#315a46}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}.options button,.choice button{padding:13px 6px;border-radius:9px;border:1px solid #c8d9ce;background:#fff;color:#244336;font-size:15px;cursor:pointer}.options button.selected{background:#205b41;border-color:#205b41;color:#fff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.choice button{padding:20px}.note{color:#6b796f;font-size:14px;margin-top:12px}button.clear{background:none;border:0;color:#426c5b;cursor:pointer;padding:10px 0;font-size:13px}.message{min-height:24px;margin:10px 0}.error{color:#ae4036!important}.notice{padding:20px;border-radius:11px;background:#eff5f0}.session strong{font-size:16px}footer{font-size:12px;color:#718177;text-align:center;padding:24px}
</style></head><body>
<header><div><h1>תכנית ביאליק | נוכחות</h1><p>דיווח עצמי מהיר · כל מפגש נוכחות שווה 7 שעות</p></div></header>
<main><section class="panel"><label for="student">בחרו את השם שלכם</label><select id="student" disabled><option>טוען שמות...</option></select><div class="message" id="message" role="status"></div></section><div id="content"></div></main><footer>מדרשה עין פרת · דיווח נוכחות עצמי</footer><script type="module" src="/app.js"></script></body></html>
